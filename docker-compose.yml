# ContentHub local — thay cho hạ tầng AWS (Lambda + Fargate + RDS + S3 + Secrets Manager).
#
#   postgres       Postgres 16 + pgvector  (database contenthub cho nội dung, n8n cho n8n)
#   flyway         chạy migration một lần rồi thoát
#   pgadmin        xem/chỉnh DB qua web
#   n8n            điều phối workflow, SỞ HỮU toàn bộ đọc/ghi DB
#   nba-content    các bước select/script/voice/music/render_* (thay Lambda nba-content)
#   nba-render     ffmpeg render video (thay ECS Fargate task nba-render)
#   publish-media  upload YouTube / Facebook (thay Lambda publish-media)
#
# Secret nằm trong file .env (xem .env.example). Media nằm ở ${MEDIA_HOST_DIR} trên host và
# được mount vào /data/media của 3 service (thay bucket S3).

name: contenthub

# Các service ghi vào bind mount ./data/media của host, nên phải chạy bằng đúng uid/gid của
# người dùng host (xem HOST_UID/HOST_GID trong .env), không phải user trong image.
x-run-as-host-user: &run-as-host-user ${HOST_UID:-1000}:${HOST_GID:-1000}

# Docker tiêm HTTP(S)_PROXY của host vào container nhưng KHÔNG tiêm no_proxy, nên lời gọi
# giữa các container (n8n -> service, nba-content -> nba-render) sẽ đi qua proxy và lỗi 502.
# Danh sách này loại chúng ra; truy cập internet (OpenAI, ElevenLabs, YouTube…) vẫn qua proxy.
x-no-proxy: &no-proxy localhost,127.0.0.1,::1,postgres,pgadmin,n8n,nba-content,nba-render,publish-media

x-service-env: &service-env
  TZ: ${TZ:-Asia/Ho_Chi_Minh}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MEDIA_DIR: /data/media
  APP_API_KEY: ${APP_API_KEY:?APP_API_KEY chưa có trong .env}
  NO_PROXY: *no-proxy
  no_proxy: *no-proxy

x-healthcheck: &http-healthcheck
  test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contenthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contenthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa có trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-contenthub}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Chỉ chạy lần đầu khi volume còn trống: tạo thêm database n8n.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:11-alpine
    container_name: contenthub-flyway
    restart: "no"
    command: -connectRetries=30 migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-contenthub}
      FLYWAY_USER: ${POSTGRES_USER:-contenthub}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: contenthub-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL chưa có trong .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD chưa có trong .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_LISTEN_PORT: 80
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:${N8N_IMAGE_TAG:-latest}
    container_name: contenthub-n8n
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-contenthub}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY chưa có trong .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: http://${N8N_HOST:-localhost}:${N8N_PORT:-5678}/
      GENERIC_TIMEZONE: ${TZ:-Asia/Ho_Chi_Minh}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # Một execution của luồng NBA chạy nhiều reel nối tiếp (render tại chỗ) nên cần trần cao.
      EXECUTIONS_TIMEOUT_MAX: ${N8N_EXECUTIONS_TIMEOUT_MAX:-28800}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTIONS_DATA_MAX_AGE:-336}
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      # Workflow chỉ gọi 3 service trong network này (API Storyteller do nba-content gọi), nên
      # xoá hẳn proxy mà Docker tiêm từ host: mọi request của n8n đi trực tiếp.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      ALL_PROXY: ""
      all_proxy: ""
      NO_PROXY: *no-proxy
      no_proxy: *no-proxy
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      # Chỉ để tiện import file JSON từ trong container; n8n không tự nạp thư mục này.
      - ./workflows/n8n:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy

  nba-content:
    build: ./services/nba-content
    container_name: contenthub-nba-content
    restart: unless-stopped
    user: *run-as-host-user
    environment:
      <<: *service-env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      STORYTELLER_API_KEY: ${STORYTELLER_API_KEY:-}
      RENDER_SERVICE_URL: http://nba-render:8000
      MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-7}
      CLEANUP_INTERVAL_HOURS: ${CLEANUP_INTERVAL_HOURS:-6}
    ports:
      - "${NBA_CONTENT_PORT:-8081}:8000"
    volumes:
      - ${MEDIA_HOST_DIR:-./data/media}:/data/media
    healthcheck: *http-healthcheck

  nba-render:
    build: ./services/nba-render
    container_name: contenthub-nba-render
    restart: unless-stopped
    user: *run-as-host-user
    environment:
      <<: *service-env
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-1}
      FFMPEG_PRESET: ${FFMPEG_PRESET:-medium}
      FFMPEG_CRF: ${FFMPEG_CRF:-20}
    ports:
      - "${NBA_RENDER_PORT:-8082}:8000"
    volumes:
      - ${MEDIA_HOST_DIR:-./data/media}:/data/media
    healthcheck: *http-healthcheck

  publish-media:
    build: ./services/publish-media
    container_name: contenthub-publish-media
    restart: unless-stopped
    user: *run-as-host-user
    environment:
      <<: *service-env
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN_NBA: ${YOUTUBE_REFRESH_TOKEN_NBA:-}
      FACEBOOK_TOKEN_SOURCE_ACCESS_TOKEN: ${FACEBOOK_TOKEN_SOURCE_ACCESS_TOKEN:-}
    ports:
      - "${PUBLISH_MEDIA_PORT:-8083}:8000"
    volumes:
      # Chỉ đọc: service này không bao giờ ghi vào thư mục media.
      - ${MEDIA_HOST_DIR:-./data/media}:/data/media:ro
    healthcheck: *http-healthcheck

volumes:
  pg_data:
  pgadmin_data:
  n8n_data:
